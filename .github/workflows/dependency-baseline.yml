name: Generate dependency verification baseline for review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Resolve all shipped and test build inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TZ: UTC
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17.0.14+7'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Check build-input provenance
        run: python3 scripts/check_build_inputs.py

      - name: Generate checksum metadata and dependency inventory
        run: |
          ./gradlew --no-daemon --no-build-cache --write-verification-metadata sha256 \
            :app:assembleFdroidRelease :app:assemblePlayRelease \
            :app:testFdroidDebugUnitTest :app:testPlayDebugUnitTest \
            :app:assembleFdroidDebugAndroidTest :app:assemblePlayDebugAndroidTest \
            :app:lintFdroidRelease :app:lintPlayRelease \
            :security-test-client:assembleDebug \
            writeDependencyInventory

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-verification-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            gradle/verification-metadata.xml
            build/reports/dependency-inventory.txt
          if-no-files-found: error
          retention-days: 14
