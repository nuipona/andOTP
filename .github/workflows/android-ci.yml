name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    name: Source, wrapper, and Python regression checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TZ: UTC
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17.0.14+7'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - uses: gradle/actions/wrapper-validation@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0

      - name: Check wrapper and immutable action references
        run: python3 scripts/check_build_inputs.py

      - name: Verify shell syntax
        run: bash -n scripts/ci_emulator_tests.sh scripts/verify_reproducible_build.sh

      - name: Provision the pinned Gradle distribution
        run: ./gradlew --no-daemon --version

      - name: Run Python and offline Gradle regression suite
        env:
          GRADLE_EXECUTABLE: ${{ github.workspace }}/gradlew
        run: python3 -m unittest discover -s scripts/tests -v

  android-build:
    name: Build, host tests, lint, and packaged manifest (${{ matrix.flavor }})
    needs: source-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        flavor: [Fdroid, Play]
        variant: [fdroid, play]
        exclude:
          - flavor: Fdroid
            variant: play
          - flavor: Play
            variant: fdroid
    env:
      TZ: UTC
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17.0.14+7'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Run host tests, focused lint, release/debug builds, and dependency inventory
        run: |
          ./gradlew --no-daemon --stacktrace \
            :app:test${{ matrix.flavor }}DebugUnitTest \
            :app:lint${{ matrix.flavor }}Release \
            :app:assemble${{ matrix.flavor }}Debug \
            :app:assemble${{ matrix.flavor }}Release \
            :app:assemble${{ matrix.flavor }}DebugAndroidTest \
            :security-test-client:assembleDebug \
            writeDependencyInventory

      - name: Inspect the packaged release manifest
        run: |
          apk="app/build/outputs/apk/${{ matrix.variant }}/release/app-${{ matrix.variant }}-release-unsigned.apk"
          test -f "$apk"
          mkdir -p app/build/ci
          apkanalyzer manifest print "$apk" > "app/build/ci/${{ matrix.variant }}-release-manifest.xml"
          python3 scripts/check_manifest.py "app/build/ci/${{ matrix.variant }}-release-manifest.xml"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: android-build-${{ matrix.variant }}
          path: |
            app/build/outputs/apk/${{ matrix.variant }}/
            app/build/ci/${{ matrix.variant }}-release-manifest.xml
            app/build/reports/
            build/reports/dependency-inventory.txt
          if-no-files-found: ignore
          retention-days: 14

  reproducibility:
    name: Independent unsigned APK and dependency comparison
    needs: [source-checks, android-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17.0.14+7'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Compare independent release builds
        run: bash scripts/verify_reproducible_build.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: reproducibility-reports
          path: reports/reproducibility/
          if-no-files-found: ignore
          retention-days: 14

  instrumentation:
    name: Instrumentation (${{ matrix.flavor }} / API ${{ matrix.api-level }})
    needs: [source-checks, android-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - flavor: Fdroid
            api-level: 28
          - flavor: Fdroid
            api-level: 36
          - flavor: Play
            api-level: 28
          - flavor: Play
            api-level: 36
    env:
      TZ: UTC
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17.0.14+7'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/ci_emulator_tests.sh ${{ matrix.flavor }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: instrumentation-${{ matrix.flavor }}-api-${{ matrix.api-level }}
          path: |
            gradle-install.log
            gradle-connected.log
            mem-emulator.log
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
          retention-days: 14
