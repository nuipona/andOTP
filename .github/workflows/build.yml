name: Build APKs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.flavor }} ${{ matrix.build-type }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: fdroid
            build-type: debug
            task: assembleFdroidDebug
          - flavor: fdroid
            build-type: release
            task: assembleFdroidRelease
          - flavor: play
            build-type: debug
            task: assemblePlayDebug
          - flavor: play
            build-type: release
            task: assemblePlayRelease

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Build ${{ matrix.flavor }} ${{ matrix.build-type }} APK
        run: ./gradlew --no-daemon :app:${{ matrix.task }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.flavor }}-${{ matrix.build-type }}-apk
          path: app/build/outputs/apk/${{ matrix.flavor }}/${{ matrix.build-type }}/*.apk
          if-no-files-found: error
